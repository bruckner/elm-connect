// Under wire=both, the default, the JSON decoder of a message or oneof
// that holds a google.protobuf.Any takes the registry and ends in `With`:
// that of `Box` is `decodeBoxWith`, which is also the JSON decoder of the
// message `BoxWith`. `Plain` holds no Any, so `PlainWith` meets nothing.
syntax = "proto3";

package shelf.v1;

import "google/protobuf/any.proto";

message Box {
  google.protobuf.Any content = 1;
}

message BoxWith {
  string label = 1;
}

message Plain {
  string label = 1;
}

message PlainWith {
  string label = 1;
}
