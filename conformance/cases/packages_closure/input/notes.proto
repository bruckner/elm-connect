// The packages generated are the closure of the requested ones: `notes.v1`
// is the only input, and it refers to `users.v1` (a field, a oneof member,
// a method's request), which refers to `orgs.v1` (a map value). Both are
// generated in full, services included.
syntax = "proto3";

package notes.v1;

import "users/v1/user.proto";

message Note {
  string title = 1;
  users.v1.User author = 2;
  oneof audience {
    users.v1.Group group = 3;
    string link = 4;
  }
}

service Notes {
  rpc ListByAuthor(users.v1.User) returns (Note);
}
