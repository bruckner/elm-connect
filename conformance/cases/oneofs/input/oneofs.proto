// Oneofs: a custom type per oneof whose first constructor is the unset
// case, held in one record field. Encoded as the set member alone;
// decoded from the first member present and not null, else unset.
syntax = "proto3";

package oneofs.v1;

message Created {
  string title = 1;
}

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
}

message NoteEvent {
  string id = 1;
  // Members of message, scalar and enum types; a multi-word member is
  // also read under its proto name.
  oneof kind {
    Created created = 2;
    string title_changed = 3;
    Color recolored = 4;
    int64 deleted_at = 5;
  }
  // A second oneof in the same message.
  oneof source {
    string user = 6;
    bool automated = 7;
  }
  repeated string tags = 8;
}

// A message whose only content is a oneof.
message Choice {
  oneof value {
    double number = 1;
    string text = 2 [json_name = "label"];
  }
}
