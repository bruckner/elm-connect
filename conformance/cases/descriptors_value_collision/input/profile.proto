syntax = "proto3";

package profile.v1;

message Profile {
  // Renamed to `nickname` (options.txt), which a oneof member's
  // descriptor is called too.
  string display_name = 1;
  oneof alias {
    string nickname = 2;
  }
  // Renamed to the value every generated module defines (options.txt).
  string version = 3;
}
