// Under unknown_fields=keep every message record ends in
// `unknownFields_ : Proto.Unknown.Fields`, its binary merge is
// Proto.Binary.mergeKeep (given the wire types each field number takes) and
// its binary encoder writes the field last. A merge step sets its field
// with a record literal up to 64 record fields, `unknownFields_` counted:
// Wide has 64 proto fields, so 65 record fields, and its steps keep the
// record update.
syntax = "proto3";

package keep.v1;

message Note {
  string title = 1;
  repeated string tags = 2;
  map<string, int64> counts = 3;
  Detail detail = 4;
  oneof origin {
    string author = 5;
    Detail copied_from = 6;
  }
  repeated sint32 marks = 7;
  double weight = 8;
}

message Detail {
  bytes body = 1;
  fixed32 crc = 2;
}

message Empty {}

message Wide {
  int32 f1 = 1;
  int32 f2 = 2;
  int32 f3 = 3;
  int32 f4 = 4;
  int32 f5 = 5;
  int32 f6 = 6;
  int32 f7 = 7;
  int32 f8 = 8;
  int32 f9 = 9;
  int32 f10 = 10;
  int32 f11 = 11;
  int32 f12 = 12;
