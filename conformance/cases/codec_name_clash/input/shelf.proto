// Under codec=both, the default, the binary codecs of `Book` are
// `encodeBookBinary` and `decodeBookBinary`, which are also the JSON codecs
// of the message `BookBinary`. An enum keeps its JSON codecs, so the enum
// `ShelfBinary` meets the binary codecs of the message `Shelf` the same
// way. The oneof `pick` of `Choice` is the type `ChoicePick`, whose binary
// codec is an encoder alone, so the message `ChoicePickBinary` meets only
// that.
syntax = "proto3";

package shelf.v1;

message Book {
  string title = 1;
}

message BookBinary {
  bytes content = 1;
}

message Shelf {
  repeated Book books = 1;
}

enum ShelfBinary {
  SHELF_BINARY_UNSPECIFIED = 0;
}

message Choice {
  oneof pick {
    string name = 1;
    int32 number = 2;
  }
}

message ChoicePickBinary {
  bytes raw = 1;
}
