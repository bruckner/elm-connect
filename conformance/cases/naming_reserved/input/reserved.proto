syntax = "proto3";

package reserved.v1;

import "google/protobuf/duration.proto";

// Each of these takes a name the module also uses for a library's: the
// map field's `Dict`, the well-known `Duration`, and `Maybe.Just` (a
// message's record constructor), as well as `String` and `Nothing` given
// by a rename.
message Dict {
  map<string, string> labels = 1;
}

message Duration {
  google.protobuf.Duration length = 1;
}

message Just {
  optional int32 count = 1;
}

message Note {
  string title = 1;
}

enum Maybe {
  MAYBE_UNSPECIFIED = 0;
}

enum Shade {
  SHADE_UNSPECIFIED = 0;
  SHADE_DARK = 1;
}
