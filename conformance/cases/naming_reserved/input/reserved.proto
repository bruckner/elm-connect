syntax = "proto3";

package reserved.v1;

// Each of these takes a name the module also uses for elm/core's: the map
// field's `Dict` and `Maybe.Just` (a message's record constructor), as
// well as `String` and `Nothing` given by a rename.
message Dict {
  map<string, string> labels = 1;
}

message Just {
  optional int32 count = 1;
}

message Note {
  string title = 1;
}

enum Maybe {
  MAYBE_UNSPECIFIED = 0;
}

enum Shade {
  SHADE_UNSPECIFIED = 0;
  SHADE_DARK = 1;
}
