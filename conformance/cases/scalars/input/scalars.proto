// Every proto3 scalar type, singular, and a message with no fields.
// 64-bit integers are Strings by default (design §3.4).
syntax = "proto3";

package scalars.v1;

message Scalars {
  double double_value = 1;
  float float_value = 2;
  int32 int32_value = 3;
  int64 int64_value = 4;
  uint32 uint32_value = 5;
  uint64 uint64_value = 6;
  sint32 sint32_value = 7;
  sint64 sint64_value = 8;
  fixed32 fixed32_value = 9;
  fixed64 fixed64_value = 10;
  sfixed32 sfixed32_value = 11;
  sfixed64 sfixed64_value = 12;
  bool bool_value = 13;
  // An explicit json_name changes the wire name, never the Elm name.
  string string_value = 14 [json_name = "text"];
  bytes bytes_value = 15;
  // jstype overrides the int64 option per field: JS_NUMBER makes an Int
  // decoded within ±(2^53 − 1), JS_STRING (the default here) a String.
  int64 small_count = 16 [jstype = JS_NUMBER];
  uint64 exact_total = 17 [jstype = JS_STRING];
}

message Empty {}
