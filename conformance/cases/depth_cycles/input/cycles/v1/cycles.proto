// Every shape of a message that nests, whose decoders read at most 100
// levels deep: a merge and a JSON decoder given the depth
// (`mergeNestedChainBytes`, `decodeNestedChain`), each message they hold
// that nests read one level deeper. A message on a cycle is made once per
// depth by `memo`; one on no cycle that nests, because it reaches a cycle,
// a `Struct` or an `Any` (`Forest`, `Sealed`, `Doc`, `Card` here), is made
// as it is entered. A message that does not nest generates as it always
// has.
syntax = "proto3";

package cycles.v1;

import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";

// A message that holds itself, and a message of another cycle, read one
// level deeper as its own are.
message Chain {
  string label = 1;
  Chain next = 2;
  Tree tree = 3;
}

// Through a list.
message Tree {
  string label = 1;
  repeated Tree children = 2;
}

// Through a map's values; and holding a carrier, which is a level of its
// own, as the messages of the cycles it holds are.
message Dir {
  map<string, Dir> entries = 1;
  Forest forest = 2;
}

// Through a oneof member, which needs no wrapper type.
message Expr {
  oneof kind {
    int32 number = 1;
    Expr negated = 2;
  }
}

// Two messages that hold each other.
message Person {
  string name = 1;
  Team team = 2;
}

message Team {
  repeated Person members = 1;
}

// Three, the last through a list.
message First {
  Second second = 1;
}

message Second {
  Third third = 1;
}

message Third {
  repeated First firsts = 1;
}

// Off every cycle, holding messages on two of them: it nests, so it is a
// level read at the top and held by `Dir` alike.
message Forest {
  repeated Tree trees = 1;
  Chain chain = 2;
}

// On a cycle and wider than a record literal's cap: its merge steps update
// the record.
message Wide {
  int32 f1 = 1;
  int32 f2 = 2;
  int32 f3 = 3;
  int32 f4 = 4;
  int32 f5 = 5;
  int32 f6 = 6;
  int32 f7 = 7;
  int32 f8 = 8;
  int32 f9 = 9;
  int32 f10 = 10;
  int32 f11 = 11;
  int32 f12 = 12;
  int32 f13 = 13;
  int32 f14 = 14;
  int32 f15 = 15;
  int32 f16 = 16;
  int32 f17 = 17;
  int32 f18 = 18;
  int32 f19 = 19;
  int32 f20 = 20;
  int32 f21 = 21;
  int32 f22 = 22;
  int32 f23 = 23;
  int32 f24 = 24;
  int32 f25 = 25;
  int32 f26 = 26;
  int32 f27 = 27;
  int32 f28 = 28;
  int32 f29 = 29;
  int32 f30 = 30;
  int32 f31 = 31;
  int32 f32 = 32;
  int32 f33 = 33;
  int32 f34 = 34;
  int32 f35 = 35;
  int32 f36 = 36;
  int32 f37 = 37;
  int32 f38 = 38;
  int32 f39 = 39;
  int32 f40 = 40;
  int32 f41 = 41;
  int32 f42 = 42;
  int32 f43 = 43;
  int32 f44 = 44;
  int32 f45 = 45;
  int32 f46 = 46;
  int32 f47 = 47;
  int32 f48 = 48;
  int32 f49 = 49;
  int32 f50 = 50;
  int32 f51 = 51;
  int32 f52 = 52;
  int32 f53 = 53;
  int32 f54 = 54;
  int32 f55 = 55;
  int32 f56 = 56;
  int32 f57 = 57;
  int32 f58 = 58;
  int32 f59 = 59;
  int32 f60 = 60;
  int32 f61 = 61;
  int32 f62 = 62;
  int32 f63 = 63;
  int32 f64 = 64;
  repeated Wide children = 65;
}

// On a cycle and holding an `Any`: its JSON decoders take the registry, so
// they are built as they are entered rather than once. The `Any`, and the
// arrays and objects of its `Struct`, `Value` and `ListValue`, count from the
// depth of the message holding them, in a singular field and in a map's
// values alike.
message Envelope {
  google.protobuf.Any payload = 1;
  repeated Envelope replies = 2;
  google.protobuf.Struct data = 3;
  google.protobuf.Value value = 4;
  google.protobuf.ListValue list = 5;
  map<string, google.protobuf.Value> values = 6;
  map<string, google.protobuf.Struct> structs = 7;
  map<string, google.protobuf.ListValue> lists = 8;
  // Off the cycle and holding an `Any`, singly and as a oneof's member: a
  // level one deeper than the envelope, its `Any` one deeper still.
  Sealed sealed = 9;
  oneof aside {
    Sealed note = 10;
  }
}

// Off every cycle, holding an `Any`.
message Sealed {
  google.protobuf.Any payload = 1;
}

// Off every cycle, above one: read at the top it is the first level, and
// the cycle counts on from it.
message Doc {
  Chain root = 1;
}

// Two messages off every cycle above it.
message Library {
  Doc doc = 1;
}

// Off every cycle, holding a `Struct`, and a message above it.
message Card {
  Meta meta = 1;
}

message Meta {
  google.protobuf.Struct data = 1;
}

// Above `Sealed`, which holds an `Any`.
message Letter {
  Sealed sealed = 1;
}

// Off every cycle and holding nothing that nests: generated as it always
// has.
message Label {
  string text = 1;
  Plain plain = 2;
}

message Plain {
  int32 n = 1;
}
