// services_wire_both's two kinds of method under wire=json: each is built
// by Proto.Method.initJson, with JSON codecs alone, where wire=both gives
// Proto.Method.init JSON and binary codecs; GetItem keeps its route.
syntax = "proto3";

package vault.v1;

import "google/api/annotations.proto";

message Item {
  string name = 1;
}

message GetItemRequest {
  string name = 1;
}

service VaultService {
  rpc GetItem(GetItemRequest) returns (Item) {
    option (google.api.http) = {
      get: "/v1/{name=items/*}"
    };
  }
  rpc PutItem(Item) returns (Item);
}
