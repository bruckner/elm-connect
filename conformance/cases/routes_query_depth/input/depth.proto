service Depth {
  // Refused: the query would reach `next` 101 messages deep.
  rpc GetTop(Level0) returns (Level0) {
    option (google.api.http) = {
      get: "/v1/top"
    };
  }

  // Fine: the deepest message is 100 down.
  rpc GetNext(Level1) returns (Level1) {
    option (google.api.http) = {
      get: "/v1/next"
    };
  }
}
