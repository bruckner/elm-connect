// Under wire=proto methods are built by Proto.Method.initProto, with
// protobuf binary codecs alone, and their calls are Rpc.Call Rpc.Proto.
// Messages and enums get both codecs whatever the option says.
syntax = "proto3";

package ledger.v1;

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_CREDIT = 1;
  KIND_DEBIT = -1;
}

message Entry {
  string memo = 1;
  sint64 amount = 2;
  Kind kind = 3;
  map<string, int32> tags = 4;
  oneof source {
    string account = 5;
    Entry reversal = 6;
  }
  repeated int32 marks = 7 [packed = false];
}

message GetEntryRequest {
  string memo = 1;
}

service LedgerService {
  rpc GetEntry(GetEntryRequest) returns (Entry);
}
