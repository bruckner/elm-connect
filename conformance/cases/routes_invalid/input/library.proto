syntax = "proto3";

package library.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message Book {
  string name = 1;
  repeated string authors = 2;
  map<string, string> labels = 3;
}

message GetBookRequest {
  string name = 1;
}

message StampBookRequest {
  google.protobuf.Timestamp at = 1;
  google.protobuf.Struct extra = 2;
}

service Library {
  // The variable names a field the request does not have.
  rpc GetBook(GetBookRequest) returns (Book) {
    option (google.api.http) = {
      get: "/v1/{book_name=shelves/*/books/*}"
    };
  }
  // The body names a field that is not a message.
  rpc CreateBook(Book) returns (Book) {
    option (google.api.http) = {
      post: "/v1/books"
      body: "name"
    };
  }
  // A map cannot be a query parameter.
  rpc FindBook(Book) returns (Book) {
    option (google.api.http) = {
      get: "/v1/books:find"
    };
  }
  // A wildcard outside a variable has no field to fill it.
  rpc ListBooks(GetBookRequest) returns (Book) {
    option (google.api.http) = {
      get: "/v1/*/books"
      additional_bindings {
        get: "/v1/books"
        response_body: "title"
      }
    };
  }
  // A path does not run through a well-known type: a timestamp's JSON is
  // a string, without its fields.
  rpc StampBook(StampBookRequest) returns (Book) {
    option (google.api.http) = {
      post: "/v1/stamps/{at.seconds}"
      body: "*"
    };
  }
  // A `Struct` is free-form JSON, not one value a path segment holds.
  rpc TagBook(StampBookRequest) returns (Book) {
    option (google.api.http) = {
      post: "/v1/tags/{extra}"
      body: "*"
    };
  }
}
