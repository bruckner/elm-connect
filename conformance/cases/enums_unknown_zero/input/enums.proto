// The enums case's Status under enum_unknown=zero: its decoder is
// Proto.Json.enumOrZero, reading an unknown name as the zero value as it
// does an unknown number; the rest of the output is the enums case's.
syntax = "proto3";

package enums.v1;

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_ARCHIVED = 2;
}

message Task {
  Status status = 1;
}
