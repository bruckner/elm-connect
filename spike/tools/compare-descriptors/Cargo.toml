# Compares the FileDescriptorSet the vendored protox builds from the editions
# corpus (spike/editions-corpus) with buf's and protoc's, field for field with
# source info removed, and the features the vendored prost-reflect resolves from
# each. spike/ORACLE.md records the run.
[package]
name = "compare-descriptors"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
prost-reflect = { path = "../../../vendor/prost-reflect", features = ["serde"] }
protox = { path = "../../../vendor/protox" }
serde_json = "1"

[patch.crates-io]
prost-reflect = { path = "../../../vendor/prost-reflect" }
protox-parse = { path = "../../../vendor/protox-parse" }
