# Prints google/protobuf/descriptor.proto as the Rust literal that
# vendor/prost-reflect/src/reflect/wkt.rs embeds. Input: a FileDescriptorSet
# holding descriptor.proto (protoc -o, without source info) on stdin.
[package]
name = "wkt-descriptor"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
prost = "0.14"
prost-types = "0.14"
