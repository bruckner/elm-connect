# The example's protos; the route fixtures' routes.proto, which the live
# suite serves too (`routes` links to conformance/routes, since a module
# cannot sit outside this directory); and the googleapis files they import,
# vendored under third_party/googleapis (its README.md) so that generation
# needs no network. The templates generate from `proto` and `routes` only,
# so googleapis reaches the plugins as imports, except where
# buf.gen.google-rpc.yaml asks for error_details.proto.
version: v2
modules:
  - path: proto
  - path: routes
  - path: third_party/googleapis
