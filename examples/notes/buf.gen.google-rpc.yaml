# `buf generate --template buf.gen.google-rpc.yaml`, run here by `just
# live-gen` beside buf.gen.yaml: the Elm for google.rpc's error details
# (`Google.Rpc`: ErrorInfo, BadRequest and the rest), which the browser
# example reads the server's error details with, from the vendored
# googleapis copy of error_details.proto. The Go server takes the same
# messages from genproto.
version: v2
inputs:
  - directory: .
    paths:
      - third_party/googleapis/google/rpc/error_details.proto
plugins:
  - local: protoc-gen-elm-connect
    out: elm/generated
