# `buf generate`, run here by `just live-gen` with the plugin on PATH: the
# Elm client from this repository's protoc-gen-elm-connect, which is all
# this template needs. Only the example's own modules are generated; the
# vendored googleapis files are imports. The Go server's stubs come from
# buf.gen.server.yaml.
version: v2
inputs:
  - directory: proto
  - directory: routes
plugins:
  - local: protoc-gen-elm-connect
    out: elm/generated
    opt:
      - streaming=server
