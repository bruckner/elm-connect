# `buf generate`, run here by `just live-gen` with the plugins on PATH: the
# Go server's stubs, at the versions its go.mod pins, and the Elm client from
# this repository's protoc-gen-elm-connect. Only the example's own modules
# are generated; the vendored googleapis files are imports. routes.proto has
# no go_package (it is the route fixtures' schema, not Go's), so the Go
# plugins are given its import path.
version: v2
inputs:
  - directory: proto
  - directory: routes
plugins:
  - local: protoc-gen-go
    out: server/gen
    opt:
      - module=github.com/bruckner/elm-connect/examples/notes/server/gen
      - Mroutes.proto=github.com/bruckner/elm-connect/examples/notes/server/gen/routes/v1;routesv1
  - local: protoc-gen-connect-go
    out: server/gen
    opt:
      - module=github.com/bruckner/elm-connect/examples/notes/server/gen
      - Mroutes.proto=github.com/bruckner/elm-connect/examples/notes/server/gen/routes/v1;routesv1
  - local: protoc-gen-elm-connect
    out: elm/generated
