name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: just check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, so it exercises the darwin/arm64 Elm asset.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for `just gitleaks`
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # The mise release that wrote mise.lock; move the two together.
          version: 2026.9.4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache Elm's packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elm
          key: check-elm-${{ runner.os }}-${{ hashFiles('mise.toml', 'elm.json', 'conformance/harness/elm.json', 'examples/notes/elm/elm.json') }}
      # Design section 8.7: only an `Open` or `Reopen as` commit changes the
      # version lines, and a `Cut` commit changes the changelog alone.
      - name: Release discipline
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/release-check.sh "$BASE..$HEAD"
      - run: just check
      # zizmor again, with the token its online audits need (the gate's
      # run is offline); only this step sees it, and it has only
      # `contents: read`.
      - name: zizmor (online audits)
        run: just zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  live:
    # Design section 7, live verification: the runtime against the example
    # server over Connect and transcoding, the route fixtures under Vanguard,
    # grpc-gateway and Envoy (func-e, from mise.toml, fetches Envoy), the
    # Connect conformance suite (connectconformance from its GitHub
    # release), and the browser example's build, which compiles the
    # README's excerpts. buf generates from vendored protos and
    # fetches nothing; the protoc plugins are Go tools, cached with Go's
    # build cache.
    # Each cache is keyed on what pins its contents, so a change to one pin
    # refetches only that one.
    name: just live (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # The mise release that wrote mise.lock; move the two together.
          version: 2026.9.4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: live-go-${{ runner.os }}-${{ hashFiles('mise.toml', 'examples/notes/server/go.sum') }}
      - name: Cache npm's downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: live-npm-${{ runner.os }}-${{ hashFiles('conformance/live/package-lock.json') }}
      - name: Cache Elm's packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elm
          key: live-elm-${{ runner.os }}-${{ hashFiles('mise.toml', 'conformance/live/elm.json', 'examples/notes/elm/elm.json') }}
      - name: Cache connectconformance
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # fetch-conformance.sh holds the version and the SHA-256s.
          path: conformance/live/build/connectconformance-*
          key: live-connectconformance-${{ runner.os }}-${{ hashFiles('conformance/live/fetch-conformance.sh') }}
      - name: Cache Envoy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # func-e installs the release envoy-version names here.
          path: ~/.local/share/func-e
          key: live-envoy-${{ runner.os }}-${{ hashFiles('conformance/live/envoy/envoy-version') }}
      - run: just live

  elm-compat:
    # Design section 8: Elm 0.19.2 is the development target; every
    # earlier 0.19 release is checked here. The runtime package and every
    # case's expected output must compile with each of them too, and the
    # runtime's and the notes example's Elm tests must pass under each that
    # can run them. 0.19.0 cannot: elm-test-rs's runner package
    # (mpizenberg/elm-test-runner 6) requires Elm 0.19.1, so its tests are
    # left out (`tests: false`).
    name: Elm ${{ matrix.elm.version }} (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elm:
          - version: 0.19.0
            sha256: d359adbee89823c641cda326938708d7227dc79aa1f162e0d8fe275f182f528a
            tests: false
          - version: 0.19.1
            sha256: e44af52bb27f725a973478e589d990a6428e115fe1bb14f03833134d6c0f155c
            tests: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Elm ${{ matrix.elm.version }}
        env:
          ELM_VERSION: ${{ matrix.elm.version }}
          ELM_SHA256: ${{ matrix.elm.sha256 }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/elm.gz" \
            "https://github.com/elm/compiler/releases/download/$ELM_VERSION/binary-for-linux-64-bit.gz"
          echo "$ELM_SHA256  $RUNNER_TEMP/elm.gz" | sha256sum --check
          gunzip "$RUNNER_TEMP/elm.gz"
          chmod +x "$RUNNER_TEMP/elm"
      - name: Cache Elm's packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elm
          key: compat-elm-${{ matrix.elm.version }}-${{ runner.os }}-${{ hashFiles('mise.toml', 'elm.json', 'conformance/harness/elm.json', 'examples/notes/elm/elm.json') }}
      - run: conformance/compile-with.sh "$RUNNER_TEMP/elm"
      # elm-test-rs, and node to run its compiled tests, as mise pins them;
      # Rust for the codec test, which writes the codec round trips'
      # modules under tests/Generated that the Elm tests import.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        if: matrix.elm.tests
        with:
          # The mise release that wrote mise.lock; move the two together.
          version: 2026.9.4
          install_args: rust node npm:elm-test-rs
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.elm.tests
      - if: matrix.elm.tests
        run: cargo test -p elm-connect-gen --test codec
      - if: matrix.elm.tests
        run: conformance/test-with.sh "$RUNNER_TEMP/elm"
