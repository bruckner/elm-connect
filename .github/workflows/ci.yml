name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: just check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, so it exercises the darwin/arm64 Elm asset.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for `just gitleaks`
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just check
        env:
          # For zizmor's online audits; the token has only `contents: read`.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  live:
    # Design section 7, live verification: the runtime against the example
    # server over Connect and transcoding, the route fixtures under Vanguard
    # and the Connect conformance suite (connectconformance from its GitHub
    # release), and the browser example's build, which compiles the README's
    # excerpts. buf generates from vendored protos and fetches nothing.
    # Each cache is keyed on what pins its contents, so a change to one pin
    # refetches only that one.
    name: just live (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: live-go-${{ runner.os }}-${{ hashFiles('mise.toml', 'examples/notes/server/go.sum') }}
      - name: Cache npm's downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: live-npm-${{ runner.os }}-${{ hashFiles('conformance/live/package-lock.json') }}
      - name: Cache Elm's packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elm
          key: live-elm-${{ runner.os }}-${{ hashFiles('mise.toml', 'conformance/live/elm.json', 'examples/notes/elm/elm.json') }}
      - name: Cache connectconformance
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # fetch-conformance.sh holds the version and the SHA-256s.
          path: conformance/live/build/connectconformance-*
          key: live-connectconformance-${{ runner.os }}-${{ hashFiles('conformance/live/fetch-conformance.sh') }}
      - run: just live

  elm-compat:
    # Design section 8: Elm 0.19.2 is the development target; every
    # earlier 0.19 release is checked here. The runtime package and every
    # case's expected output must compile with each of them too.
    name: Elm ${{ matrix.elm.version }} (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elm:
          - version: 0.19.0
            sha256: d359adbee89823c641cda326938708d7227dc79aa1f162e0d8fe275f182f528a
          - version: 0.19.1
            sha256: e44af52bb27f725a973478e589d990a6428e115fe1bb14f03833134d6c0f155c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Elm ${{ matrix.elm.version }}
        env:
          ELM_VERSION: ${{ matrix.elm.version }}
          ELM_SHA256: ${{ matrix.elm.sha256 }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/elm.gz" \
            "https://github.com/elm/compiler/releases/download/$ELM_VERSION/binary-for-linux-64-bit.gz"
          echo "$ELM_SHA256  $RUNNER_TEMP/elm.gz" | sha256sum --check
          gunzip "$RUNNER_TEMP/elm.gz"
          chmod +x "$RUNNER_TEMP/elm"
      - run: conformance/compile-with.sh "$RUNNER_TEMP/elm"
