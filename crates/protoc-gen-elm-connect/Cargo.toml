[package]
name = "protoc-gen-elm-connect"
description = "protoc plugin that generates Elm clients for protobuf APIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/bruckner/elm-connect/tree/main/docs"
readme = "README.md"
keywords.workspace = true
categories = ["command-line-utilities", "development-tools", "web-programming"]
# The integration tests run from the repository, reading its conformance
# corpus and runtime outside the crate, so they are not published.
exclude = ["tests/"]

[dependencies]
elm-connect-gen.workspace = true
prost.workspace = true
prost-reflect.workspace = true
prost-types.workspace = true

[dev-dependencies]
protox.workspace = true
