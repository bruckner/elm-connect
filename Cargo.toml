[workspace]
members = [
    "crates/elm-connect-gen",
    "crates/protoc-gen-elm-connect",
    "crates/elm-connect",
]
# The vendored crates are path patches, not members: the gate's fmt,
# clippy and tests stay on this repository's code, and vendor/Cargo.toml
# is the workspace that runs their own tests (THIRD_PARTY.md).
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
# The minimum supported Rust version is the toolchain mise.toml pins: `just
# check` builds and tests with exactly that one, locally and in CI, so it
# needs no job of its own. tests/lockstep.rs keeps the two equal.
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bruckner/elm-connect"
homepage = "https://github.com/bruckner/elm-connect#readme"
keywords = ["elm", "protobuf", "connect", "grpc", "codegen"]

[workspace.dependencies]
elm-connect-gen = { path = "crates/elm-connect-gen", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
miette = "7.6"
prost = "0.14"
prost-reflect = "0.16"
prost-types = "0.14"
protox = "0.10"
serde_json = "1"
similar = "3"

# protox, prost-reflect and prost-types with protobuf editions support,
# vendored under vendor/ (THIRD_PARTY.md says from where and what changed).
[patch.crates-io]
prost-reflect = { path = "vendor/prost-reflect" }
prost-types = { path = "vendor/prost-types" }
protox = { path = "vendor/protox" }
protox-parse = { path = "vendor/protox-parse" }
