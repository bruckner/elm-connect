# The single toolchain pin for this repository: `mise install` provides
# everything `just check` needs, locally and in CI.

[tools]
rust = { version = "1.99.0", components = "rustfmt,clippy" }

# Elm comes from the official release. Upstream names its assets
# `elm-<version>-{mac-arm,mac-x64,linux-arm,linux-x64,windows-x64}.gz`;
# mise's github backend does not recognise `arm` as arm64 and fails on
# linux/arm64 with "No matching asset found", so each platform names its
# asset explicitly and `bin` names the gunzipped executable.
"github:elm/compiler" = { version = "0.19.2", bin = "elm", platforms = { linux-arm64 = { asset_pattern = "elm-*-linux-arm.gz" }, linux-x64 = { asset_pattern = "elm-*-linux-x64.gz" }, macos-arm64 = { asset_pattern = "elm-*-mac-arm.gz" }, macos-x64 = { asset_pattern = "elm-*-mac-x64.gz" }, windows-x64 = { asset_pattern = "elm-*-windows-x64.gz" } } }
"github:avh4/elm-format" = "0.8.8"
"github:zizmorcore/zizmor" = "1.30.1"
gitleaks = "8.30.1"
# `just deny`: advisories, licenses, bans and sources of the Rust
# dependencies (deny.toml).
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"npm:elm-test-rs" = "3.2.0-0"
# npm installs the npm-backed tools, and elm-test-rs runs its compiled
# test runner under node.
node = "24.21.0"
just = "1.58.0"
# The live suite (`just live`, conformance/live/): the example server is Go,
# and buf generates its stubs and the example's Elm.
go = "1.27.3"
buf = "1.73.0"

[settings]
# mise.lock pins each tool's exact version and, where the backend
# provides one, the checksum of its download for every platform CI and
# development use; `mise lock` refreshes it after a pin moves.
lockfile = true
# Newer mise runs npm tools via a node launcher; elm-test-rs's native binary breaks that (SyntaxError).
npm.package_manager = "npm"
